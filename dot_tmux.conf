#====================================================================================
# quick refresh
#====================================================================================
# passthrough all options to tmux plugins
set -g allow-passthrough on
set -g visual-activity off

unbind r 
bind r source-file ~/.tmux.conf

set -g prefix C-b

set-option -sa terminal-overrides ",xterm:Tc"
set -g mouse on

#====================================================================================
# Start numbering with 1
#====================================================================================
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g set-clipboard on          # use system clipboard

# Use SSH escape to forward copy to local machine
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "tmux save-buffer - | ssh youruser@yourlocal 'DISPLAY=:0 xclip -selection clipboard'"
#====================================================================================
# Change super combination
#====================================================================================
# unbind C-b
# set -g prefix C-Space
# bind C-Space send-prefix

#====================================================================================
# List of plugins
#====================================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'

set -g @plugin 'dracula/tmux-yank'
set -g @dracula-show-powerline true
set -g @dracula-fixed-location "Stuttgart"
set -g @dracula-plugins "weather"
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
# set -g @plugin 'rose-pine/tmux'
# set -g @rose_pine_variant "moon"
# set -g @rose-pine-show-powerline true
set -g status-position bottom

# Set the format for inactive windows

# Set the format for the active window
# set -g window-status-current-format "#[bold]#I:#W "
# set -g window-status-current-format "#I:#W #T"

set -g window-status-current-format "#I:#{b:pane_current_path}"
# Update the status bar more frequently to reflect directory changes
set -g status-interval 5

set -g @plugin 'tmux-plugins/tmux-yank'

# allow to save tmux sessions and reload them
# testing
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

set-option -g allow-rename off
set-option -g automatic-rename off

#====================================================================================
# copy-paste in vi style
#====================================================================================
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel


#====================================================================================
# allow easy tmux movement with vim
#====================================================================================

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

#====================================================================================
# Status Bar
#====================================================================================
# Set the format for the active window (shows folder name instead of hostname)
set -g window-status-current-format "#I:#W@#{b:pane_current_path}"

# Set the format for inactive windows (optional - for consistency)
set -g window-status-format "#I:#W@#{b:pane_current_path}"

# Active window format: index in cyan, name in green, '@' in yellow, folder in magenta
set -g window-status-current-format \
  "#[fg=colour51]#I #[fg=colour82]#W#[fg=colour226]@#[fg=colour201]#{b:pane_current_path}"

# Inactive windows: greyed out index and name, separator and folder in less bright colors
set -g window-status-format \
  "#[fg=colour241]#I #[fg=colour241]#W#[fg=colour240]@#[fg=colour245]#{b:pane_current_path}"


set -g window-status-bell-style fg=colour196
set -g window-status-activity-style fg=colour208
# Update the status bar more frequently to reflect directory changes
set -g status-interval 5

