---
- hosts: localhost
  become: yes
  vars:
    common_tools:
      - ripgrep
      - fzf
      - neovim
      - git
      - lazygit
      - tmux
      - curl
      - jq
      # Add more shared tool names here

    ubuntu_tools:
      - nodejs
      - fd-find

    mac_tools:
      - node
      - fd

  tasks:
    - name: Install developer tools on Ubuntu
      apt:
        name: "{{ common_tools + ubuntu_tools }}"
        state: present
        update_cache: yes
      when: ansible_facts['os_family'] == "Debian"

    - name: Install developer tools on Mac
      homebrew:
        name: "{{ common_tools + mac_tools }}"
        state: present
      when: ansible_facts['os_family'] == "Darwin"
