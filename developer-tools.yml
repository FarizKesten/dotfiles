---
- hosts: localhost
  connection: local
  gather_facts: yes
  vars:
    ansible_python_interpreter : "{{ansible_playbook_python}}"
    common_tools:
      - ripgrep
      - fzf
      - neovim
      - git
      - lazygit
      - tmux
      - curl
      - jq
      - zsh
      - tree-sitter-cli
      - w3m
      - lynx
      - links

    ubuntu_tools:
      - nodejs
      - fd-find

    mac_tools:
      - node
      - fd
      - tree-sitter

  tasks:
    - name: Install developer tools on Ubuntu
      become: yes
      apt:
        name: "{{ common_tools + ubuntu_tools }}"
        state: present
        update_cache: yes
      when: ansible_facts['os_family'] == "Debian"

    - name: Install developer tools on Mac
      homebrew:
        name: "{{ common_tools + mac_tools }}"
        state: present
      when: ansible_facts['os_family'] == "Darwin"

    - name: Install Bitwarden CLI on Ubuntu/Linux
      become: yes
      apt:
        name: npm
        state: present
      when: ansible_facts['os_family'] == "Debian"

    - name: Install Bitwarden CLI via npm on Linux
      npm:
        name: "@bitwarden/cli"
        global: yes
      when: ansible_facts['os_family'] == "Debian"

    - name: Install Bitwarden CLI on macOS
      homebrew:
        name: bitwarden-cli
        state: present
      when: ansible_facts['os_family'] == "Darwin"
