#====================================================================================
# PERFORMANCE & GENERAL SETTINGS
#====================================================================================

# Set true color support
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm*:Tc"

# Much faster key repetition
set -s escape-time 0

# Increase scrollback buffer size
set -g history-limit 50000

# Enable mouse support
set -g mouse on

# Enable focus events for vim
set -g focus-events on

#====================================================================================
# NUMBERING & WINDOW MANAGEMENT
#====================================================================================

# Start numbering with 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

#====================================================================================
# KEY BINDINGS
#====================================================================================

# Keep default prefix (or change if you prefer)
set -g prefix C-b

# Quick refresh
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Better pane splitting (more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window with current path
bind c new-window -c "#{pane_current_path}"

# Pane resizing (more convenient)
bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2  
bind -n S-Down resize-pane -D 1
bind -n S-Up resize-pane -U 1

#====================================================================================
# VIM INTEGRATION
#====================================================================================

# Copy-paste in vi style
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Smart pane switching with awareness of Vim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\S+\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Handle tmux versions for C-\ binding
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"

# Copy mode vim bindings
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

#====================================================================================
# PLUGINS
#====================================================================================

# Essential plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Vim integration
set -g @plugin 'christoomey/vim-tmux-navigator'

# Copy/paste
set -g @plugin 'tmux-plugins/tmux-yank'

# Session restoration
set -g @plugin 'tmux-plugins/tmux-resurrect' 
set -g @plugin 'tmux-plugins/tmux-continuum'

# Theme (using only catppuccin for consistency)
set -g @plugin 'catppuccin/tmux#latest'

#====================================================================================
# PLUGIN CONFIGURATION
#====================================================================================

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-save-pane-contents 'on' 
set -g @resurrect-save-bash-history 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# Continuum settings (automatic save/restore)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Catppuccin theme settings (beautiful & minimal)
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_default_fill 'number'
set -g @catppuccin_window_current_fill 'number'
set -g @catppuccin_status_modules_right 'directory session'
set -g @catppuccin_status_left_separator  ' '
set -g @catppuccin_status_right_separator ' '
set -g @catppuccin_directory_text '#{b:pane_current_path}'

#====================================================================================
# STATUS BAR & APPEARANCE
#====================================================================================

# Status bar position
set -g status-position bottom

# Window status format (clean and simple)
set -g window-status-current-format "#[bold]#I:#W"
set -g window-status-format "#I:#W"

#====================================================================================
# CUSTOM STYLING (enhances catppuccin)
#====================================================================================

# Pane borders (subtle and beautiful)
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#f38ba8'

# Message styling
set -g message-style 'fg=#cdd6f4,bg=#45475a'
set -g message-command-style 'fg=#cdd6f4,bg=#45475a'

#====================================================================================
# INITIALIZE TPM (keep at bottom)
#====================================================================================
run '~/.tmux/plugins/tpm/tpm'
